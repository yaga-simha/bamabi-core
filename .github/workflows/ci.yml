name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # 1. Quality Gates (Formatting, Typos, Deny, Isolation, Clippy, Rustdoc)
  # ============================================================================
  quality-gates:
    name: Quality Gates & Static Audits
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Spellcheck repository (`typos`)
        uses: crate-ci/typos@v1.31.1

      - name: Install `cargo-deny`
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Audit advisories, licenses, bans & sources (`cargo-deny`)
        run: cargo deny --all-features check advisories licenses bans sources

      - name: Formatting, forbid(unsafe_code), headless isolation & Bevy idiom audit
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check

          for safe_lib in \
            crates/bamabi_host/src/lib.rs \
            crates/bamabi_watcher/src/lib.rs; do
            if ! grep -q '#!\[forbid(unsafe_code)\]' "$safe_lib"; then
              echo "ERROR: $safe_lib is missing required #![forbid(unsafe_code)] declaration!"
              exit 1
            fi
          done

          for cmd in \
            "cargo tree -p bamabi_host --edges normal --all-features" \
            "cargo tree -p bamabi_host --all-features"; do
            if $cmd | grep -E 'bevy_render|bevy_reflect|bevy_scene|bevy_asset|\bnotify\b|bevy_winit|bevy_window|wgpu|glutin'; then
              echo "ERROR: bamabi_host leaked forbidden heavy Bevy or notify dependency via '$cmd'!"
              exit 1
            fi
          done

          if grep -E '"(bevy_render|bevy_winit|bevy_window|wgpu|glutin|bevy_scene|bevy_asset)"' Cargo.lock; then
            echo "ERROR: Forbidden heavy Bevy/window/render crate found in bamabi-core/Cargo.lock!"
            exit 1
          fi

          if grep -rn '&mut ResMut<' crates/bamabi_host/src crates/bamabi_watcher/src; then
            echo "ERROR: Found '&mut ResMut<' anti-pattern in Layer 2 sources!"
            exit 1
          fi

      - name: "Audit no #[allow] attributes in crates/*/src"
        shell: bash
        run: |
          set -euo pipefail
          if grep -rnE '#!?\[allow' crates/*/src; then
            echo "ERROR: Found forbidden #[allow] / #![allow] attribute in crates/*/src!"
            exit 1
          fi

      - name: Audit no non-test unwrap/expect/panic in crates/*/src
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import re
          import sys

          ITEM_KW = {
              "fn", "mod", "struct", "enum", "trait", "impl", "type", "static",
              "const", "use", "macro_rules", "let", "unsafe", "async", "extern",
          }
          VIOL_RE = re.compile(r"\.(?:unwrap|expect)\s*\(|\b(?:panic|unreachable|todo)!\s*[\(\[\{]")
          CFG_TEST_RE = re.compile(r"#\s*\[\s*cfg\s*\(\s*test\s*\)\s*\]")

          def strip_comments_and_strings(src: str) -> str:
              out = []
              n = len(src)
              i = 0
              while i < n:
                  c = src[i]
                  nxt = src[i + 1] if i + 1 < n else ""
                  if c == "/" and nxt == "/":
                      while i < n and src[i] != "\n":
                          out.append(" ")
                          i += 1
                      continue
                  if c == "/" and nxt == "*":
                      depth = 1
                      out.extend("  ")
                      i += 2
                      while i < n and depth > 0:
                          if src[i] == "/" and i + 1 < n and src[i + 1] == "*":
                              depth += 1
                              out.extend("  ")
                              i += 2
                          elif src[i] == "*" and i + 1 < n and src[i + 1] == "/":
                              depth -= 1
                              out.extend("  ")
                              i += 2
                          else:
                              out.append("\n" if src[i] == "\n" else " ")
                              i += 1
                      continue
                  raw_prefix = 0
                  if c == "r" and nxt in ('"', "#"):
                      raw_prefix = 1
                  elif c in ("b", "c") and nxt == "r" and i + 2 < n and src[i + 2] in ('"', "#"):
                      raw_prefix = 2
                  if raw_prefix and (i == 0 or not (src[i - 1].isalnum() or src[i - 1] == "_")):
                      j = i + raw_prefix
                      hashes = 0
                      while j < n and src[j] == "#":
                          hashes += 1
                          j += 1
                      if j < n and src[j] == '"':
                          out.extend(src[i : j + 1])
                          i = j + 1
                          end_seq = '"' + ("#" * hashes)
                          while i < n and not src.startswith(end_seq, i):
                              out.append("\n" if src[i] == "\n" else " ")
                              i += 1
                          if i < n:
                              out.extend(end_seq)
                              i += len(end_seq)
                          continue
                  str_prefix = 0
                  if c == '"':
                      str_prefix = 0
                  elif c in ("b", "c") and nxt == '"' and (i == 0 or not (src[i - 1].isalnum() or src[i - 1] == "_")):
                      str_prefix = 1
                  if c == '"' or str_prefix:
                      out.extend(src[i : i + str_prefix + 1])
                      i += str_prefix + 1
                      while i < n:
                          ch = src[i]
                          if ch == "\\":
                              out.append(" ")
                              i += 1
                              if i < n:
                                  out.append("\n" if src[i] == "\n" else " ")
                                  i += 1
                          elif ch == '"':
                              out.append('"')
                              i += 1
                              break
                          else:
                              out.append("\n" if ch == "\n" else " ")
                              i += 1
                      continue
                  if c == "'":
                      if nxt == "\\":
                          out.append("'")
                          i += 1
                          while i < n:
                              ch = src[i]
                              if ch == "\\":
                                  out.append(" ")
                                  i += 1
                                  if i < n:
                                      out.append("\n" if src[i] == "\n" else " ")
                                      i += 1
                              elif ch == "'":
                                  out.append("'")
                                  i += 1
                                  break
                              else:
                                  out.append("\n" if ch == "\n" else " ")
                                  i += 1
                          continue
                      elif i + 2 < n and src[i + 2] == "'" and nxt != "\n":
                          out.extend(["'", " ", "'"])
                          i += 3
                          continue
                  out.append(c)
                  i += 1
              return "".join(out)

          def non_test_mask(stripped: str) -> list[bool]:
              n = len(stripped)
              lines = stripped.splitlines(keepends=True)
              line_non_test = [False] * len(lines)
              brace = paren = bracket = 0
              in_cfg = False
              cfg_entered_brace = False
              cfg_base = (0, 0, 0)
              cfg_decided_kind = False
              cfg_allow_comma = True
              cfg_angle = 0
              cfg_spans = {m.start(): m.end() for m in CFG_TEST_RE.finditer(stripped)}
              line_idx = 0
              i = 0
              while i < n:
                  if not in_cfg and i in cfg_spans:
                      in_cfg = True
                      cfg_entered_brace = False
                      cfg_base = (brace, paren, bracket)
                      cfg_decided_kind = False
                      cfg_allow_comma = True
                      cfg_angle = 0
                      end = cfg_spans[i]
                      while i < end:
                          if stripped[i] == "\n":
                              line_idx += 1
                          i += 1
                      continue
                  ch = stripped[i]
                  if ch == "\n":
                      line_idx += 1
                      i += 1
                      continue
                  if not in_cfg:
                      if not ch.isspace():
                          line_non_test[line_idx] = True
                      if ch == "{":
                          brace += 1
                      elif ch == "}":
                          brace = max(0, brace - 1)
                      elif ch == "(":
                          paren += 1
                      elif ch == ")":
                          paren = max(0, paren - 1)
                      elif ch == "[":
                          bracket += 1
                      elif ch == "]":
                          bracket = max(0, bracket - 1)
                      i += 1
                      continue
                  if ch.isspace():
                      i += 1
                      continue
                  if not cfg_entered_brace and not cfg_decided_kind and (brace, paren, bracket) == cfg_base:
                      if ch == "#" and i + 1 < n and stripped[i + 1] == "[":
                          bracket += 1
                          i += 2
                          continue
                      if ch.isalpha() or ch == "_":
                          j = i
                          while j < n and (stripped[j].isalnum() or stripped[j] == "_"):
                              j += 1
                          ident = stripped[i:j]
                          if ident == "pub":
                              i = j
                              continue
                          cfg_decided_kind = True
                          cfg_allow_comma = ident not in ITEM_KW
                          i = j
                          continue
                  if not cfg_entered_brace and (brace, paren, bracket) == cfg_base:
                      if ch == ";" or (ch == "," and cfg_allow_comma and cfg_angle == 0):
                          in_cfg = False
                          i += 1
                          continue
                      if ch == "{":
                          cfg_entered_brace = True
                          brace += 1
                          i += 1
                          continue
                      if ch == "}":
                          in_cfg = False
                          brace = max(0, brace - 1)
                          i += 1
                          continue
                      if cfg_allow_comma:
                          prev = stripped[i - 1] if i > 0 else ""
                          nxt = stripped[i + 1] if i + 1 < n else ""
                          if ch == "<" and nxt not in ("<", "=") and (prev.isalnum() or prev in ("_", ":")):
                              cfg_angle += 1
                          elif ch == ">" and cfg_angle > 0 and prev not in ("-", "=", ">"):
                              cfg_angle -= 1
                  if ch == "{":
                      brace += 1
                  elif ch == "}":
                      brace = max(0, brace - 1)
                      if cfg_entered_brace and brace <= cfg_base[0]:
                          in_cfg = False
                  elif ch == "(":
                      paren += 1
                  elif ch == ")":
                      paren = max(0, paren - 1)
                  elif ch == "[":
                      bracket += 1
                  elif ch == "]":
                      bracket = max(0, bracket - 1)
                  i += 1
              return line_non_test

          hits = []
          for path in sorted(glob.glob("crates/*/src/**/*.rs", recursive=True)):
              with open(path, "r", encoding="utf-8") as fh:
                  src = fh.read()
              stripped = strip_comments_and_strings(src)
              mask = non_test_mask(stripped)
              for lineno, (orig_line, stripped_line, is_non_test) in enumerate(
                  zip(src.splitlines(), stripped.splitlines(), mask), 1
              ):
                  if is_non_test and VIOL_RE.search(stripped_line):
                      hits.append(f"{path}:{lineno}: {orig_line.strip()}")

          if hits:
              print("ERROR: Found non-test .unwrap()/.expect()/panic!/unreachable!/todo! in crates/*/src:")
              for hit in hits:
                  print(f"  {hit}")
              sys.exit(1)
          print("OK: zero non-test unwrap/expect/panic violations in crates/*/src")
          PY

      - name: Clippy across default, signature-verification, bridge-reflect, and all-features
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p bamabi_host_sys -p bamabi_host --features signature-verification --all-targets -- -D warnings
          cargo clippy -p bamabi_host_sys --features bridge-reflect --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rustdoc build (default and all-features)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --workspace --no-deps
          cargo doc --workspace --no-deps --all-features

      - name: Check excluded guest fixtures
        run: |
          cargo check --manifest-path tests/asymmetric_rust_mod/Cargo.toml
          cargo check --manifest-path tests/fixtures/panic_abort_mod/Cargo.toml

  # ============================================================================
  # 2. Cross-OS Test Matrix & Linux 10k Soak
  # ============================================================================
  test-matrix:
    name: Test Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Free disk space on Linux runner
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize MSVC Developer Environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Layer 2 workspace, feature, bamabi_watcher, doc, and 10k soak suites
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          set -euo pipefail
          if [ -n "${VCToolsInstallDir:-}" ] && command -v cygpath >/dev/null 2>&1; then
            MSVC_BIN="$(cygpath -u "${VCToolsInstallDir}bin/Hostx64/x64")"
            if [ -x "${MSVC_BIN}/link.exe" ]; then
              export PATH="${MSVC_BIN}:${PATH}"
            fi
          fi
          cargo test --workspace
          cargo test -p bamabi_host_sys -p bamabi_host --features signature-verification
          cargo test --workspace --all-features
          cargo test -p bamabi_watcher --all-features
          cargo test --doc --all-features
          if [ "${RUNNER_OS:-}" = "Linux" ]; then
            BAM_SOAK_CYCLES=10000 cargo test -p bamabi_host --test soak_10k_reloads --release
          fi

  # ============================================================================
  # 3. True Rust Asymmetry Matrix: MSRV 1.95 / Stable / Nightly x O0/O3 x Unwind/Abort
  # ============================================================================
  asymmetry-rust:
    name: Asymmetric Rust Matrix (MSRV 1.95, ${{ matrix.guest_toolchain }}, opt=${{ matrix.opt_level }}, panic=${{ matrix.panic_mode }})
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    strategy:
      fail-fast: false
      matrix:
        include:
          - guest_toolchain: "1.95.0"
            opt_level: "0"
            panic_mode: "unwind"
          - guest_toolchain: "1.95.0"
            opt_level: "3"
            panic_mode: "unwind"
          - guest_toolchain: "stable"
            opt_level: "0"
            panic_mode: "unwind"
          - guest_toolchain: "stable"
            opt_level: "3"
            panic_mode: "abort"
          - guest_toolchain: "nightly"
            opt_level: "0"
            panic_mode: "unwind"
          - guest_toolchain: "nightly"
            opt_level: "3"
            panic_mode: "abort"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install stable host toolchain + ${{ matrix.guest_toolchain }} guest toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install "${{ matrix.guest_toolchain }}" --profile minimal

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: asym-rust-${{ matrix.guest_toolchain }}-o${{ matrix.opt_level }}-${{ matrix.panic_mode }}

      - name: Build asymmetric Rust guests with ${{ matrix.guest_toolchain }} (opt=${{ matrix.opt_level }}, panic=${{ matrix.panic_mode }})
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ matrix.opt_level }}
          CARGO_PROFILE_RELEASE_PANIC: ${{ matrix.panic_mode }}
        run: |
          mkdir -p target/fixtures
          cargo "+${{ matrix.guest_toolchain }}" build \
            --manifest-path tests/asymmetric_rust_mod/Cargo.toml \
            --release
          cp tests/asymmetric_rust_mod/target/release/libasymmetric_rust_mod.so \
             target/fixtures/libasymmetric_rust_mod.so
          if [ "${{ matrix.panic_mode }}" = "abort" ]; then
            cargo "+${{ matrix.guest_toolchain }}" build \
              --manifest-path tests/fixtures/panic_abort_mod/Cargo.toml \
              --release
            cp tests/fixtures/panic_abort_mod/target/release/libpanic_abort_mod.so \
               target/fixtures/libpanic_abort_mod.so
          fi

      - name: Load asymmetric Rust guest into stable host & execute integration suites
        env:
          BAM_FIXTURE_DIR: "${{ github.workspace }}/target/fixtures"
        run: |
          if [ "${{ matrix.panic_mode }}" = "unwind" ]; then
            cargo +stable test -p bamabi_host
          else
            cargo +stable test -p bamabi_host --test ffi
            cargo +stable test -p bamabi_host --test scheduling -- --skip test_cross_runtime_panic_containment
            cargo +stable test -p bamabi_host --test lifecycle panic_abort_guest_terminates_subprocess
          fi

  # ============================================================================
  # 4. Cross-OS C99 / C11 Compiler Matrix
  # ============================================================================
  asymmetry-c:
    name: Asymmetric C99/C11 Matrix (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang
          - os: windows-latest
            cc: gcc
          - os: windows-latest
            cc: cl.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize MSVC Developer Environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: asym-c-${{ matrix.os }}-${{ matrix.cc }}

      - name: Compile C99/C11 fixtures (`${{ matrix.cc }}`), test ABI layout & run FFI/E2E suites
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          MSYS_NO_PATHCONV: "1"
        run: |
          set -euo pipefail
          if [ -n "${VCToolsInstallDir:-}" ] && command -v cygpath >/dev/null 2>&1; then
            MSVC_BIN="$(cygpath -u "${VCToolsInstallDir}bin/Hostx64/x64")"
            if [ -x "${MSVC_BIN}/link.exe" ]; then
              export PATH="${MSVC_BIN}:${PATH}"
            fi
          fi
          cargo test -p bamabi_host --test ffi --test e2e
          if [ "${{ matrix.cc }}" = "cl.exe" ]; then
            cl.exe /nologo /LD /TC /std:c11 /W4 /WX /I target/include \
              /Fo:target/ /Fe:target/asymmetric_c_mod_cl.dll tests/asymmetric_c_mod/mod.c
            cl.exe /nologo /TC /std:c11 /W4 /WX /I target/include \
              /Fo:target/ /Fe:target/test_abi_layout.exe tests/asymmetric_c_mod/test_abi_layout.c
            ./target/test_abi_layout.exe
          else
            if command -v make >/dev/null 2>&1; then
              make -C tests/asymmetric_c_mod clean all
            else
              "${CC}" -std=c99 -Wall -Wextra -Werror -O3 -I target/include -shared tests/asymmetric_c_mod/mod.c -o target/asymmetric_c_mod_cc.dll
            fi
            "${CC}" -std=c99 -Wall -Wextra -Werror -I target/include \
              tests/asymmetric_c_mod/test_abi_layout.c -o target/test_abi_layout
            ./target/test_abi_layout
          fi

  # ============================================================================
  # 5. Benchmark Smoke Gate (`chunk_throughput` & `v03_subsystem_bench` `-- --test`)
  # ============================================================================
  benchmark-gate:
    name: Benchmark Smoke Gate (chunk_throughput & v03_subsystem_bench)
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: bench-gate

      - name: Pre-stage external asymmetric mods & run benchmark smoke tests
        run: |
          mkdir -p target/fixtures
          cargo test -p bamabi_host --test ffi test_c99_shared_library_mutates_rust_components_via_vtable
          cargo build --manifest-path tests/asymmetric_rust_mod/Cargo.toml --release
          cp tests/asymmetric_rust_mod/target/release/libasymmetric_rust_mod.so \
             target/fixtures/libasymmetric_rust_mod.so
          make -C tests/asymmetric_c_mod
          cp tests/asymmetric_c_mod/libasymmetric_c_mod.so \
             target/fixtures/libasymmetric_c_mod.so
          BAM_FIXTURE_DIR="${{ github.workspace }}/target/fixtures" \
            cargo bench -p bamabi_host --bench chunk_throughput -- --test
          cargo bench -p bamabi_host --bench v03_subsystem_bench -- --test

  # ============================================================================
  # 6. Line Coverage Gate (`>= 85%` on `bamabi_host_sys` & `bamabi_host`)
  # ============================================================================
  coverage:
    name: Coverage Gate (>=85% bamabi_host_sys & bamabi_host)
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install stable Rust with `llvm-tools-preview`
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install `cargo-llvm-cov`
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: llvm-cov

      # `crates/bamabi_watcher/` remains excluded because OS `notify` / filesystem watcher
      # event-loop branches yield 76.38% line coverage (< 85%), whereas all `bamabi_host_sys`
      # and `bamabi_host` files are >= 85% and combined `host_sys + host` coverage is ~93.36%.
      - name: Enforce >= 85% line coverage on `bamabi_host_sys` & `bamabi_host`
        run: |
          cargo llvm-cov --no-report --all-features \
            -p bamabi_host_sys -p bamabi_host -p bamabi_watcher
          cargo llvm-cov report \
            --ignore-filename-regex '(crates/bamabi_watcher/|(tests|examples|xtask|benches)/|\.cargo/)' \
            --fail-under-lines 85

  # ============================================================================
  # 7. Miri Soundness (`-Zmiri-tree-borrows`)
  # ============================================================================
  miri:
    name: Miri (-Zmiri-tree-borrows)
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: "-Zmiri-tree-borrows"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install nightly Rust with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Setup Miri sysroot
        run: cargo +nightly miri setup

      - name: Cache Cargo & Miri artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: miri-tree-borrows

      # Note: `signature-verification` (`signing_tests`) is intentionally excluded from Miri because
      # its `TempDirGuard` filesystem tests fail under Miri isolation and `loader::signing` is
      # `#[forbid(unsafe_code)]`; `bridge-reflect` (`ffi::validation`) exercises unsafe `ReflectFromPtr`
      # slot casting under `-Zmiri-tree-borrows`.
      - name: Run Miri on `bamabi_host_sys` unit tests (default and `bridge-reflect`)
        run: |
          cargo +nightly miri test -p bamabi_host_sys --lib
          cargo +nightly miri test -p bamabi_host_sys --lib --features bridge-reflect -- ffi::validation

  # ============================================================================
  # 8. Loom Atomic Concurrency Verification
  # ============================================================================
  loom:
    name: Loom Atomic Concurrency Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: loom-concurrency

      - name: Verify `DROP_PAGES` generation/epoch & ABA reuse models under Loom (3 models)
        run: cargo test -p bamabi_host_sys --test loom_drop_trampoline --release

  # ============================================================================
  # 9. UBSan C99 Verification
  # ============================================================================
  sanitizers:
    name: UBSan C99 Verification
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build UBSan-instrumented C99 guest mod & run host integration suites
        env:
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          mkdir -p target/fixtures
          cargo test -p bamabi_host --test ffi test_c99_shared_library_mutates_rust_components_via_vtable
          clang -std=c99 -Wall -Wextra -Werror -O1 -g -fno-omit-frame-pointer \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I target/include -shared -fPIC \
            tests/asymmetric_c_mod/mod.c \
            -o target/fixtures/libasymmetric_c_mod.so
          BAM_FIXTURE_DIR="${{ github.workspace }}/target/fixtures" \
            cargo test -p bamabi_host
