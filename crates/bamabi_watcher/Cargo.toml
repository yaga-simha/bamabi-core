[package]
name = "bamabi_watcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Safe (`#![forbid(unsafe_code)]`) debounced filesystem hot-reload watcher (`ModHotReloadPlugin`) for `bamabi`"
readme = "README.md"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
signature-verification = [
    "bamabi_host_sys/signature-verification",
    "bamabi_host/signature-verification",
]

[dependencies]
bamabi_host_sys = { workspace = true, features = ["dynamic-loader"] }
bamabi_host = { workspace = true, features = ["dynamic-loader"] }
bamabi_sys = { workspace = true }
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
notify-debouncer-full = { workspace = true }
semver = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bamabi_macros = { workspace = true }
bamabi_sdk_gen = { workspace = true }
bamabi_sys = { workspace = true }
